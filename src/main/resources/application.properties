# =========================
# UNG DUNG
# =========================
spring.application.name=quanlydaotao
server.port=8089

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================
# SQL SERVER
# =========================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=quanlydaotao;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================
# CONNECTION POOL
# =========================
spring.datasource.hikari.pool-name=Nhom8Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000

# =========================
# KHOI TAO SQL
# =========================
spring.sql.init.mode=never

# =========================
# XU LY LOI
# =========================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# =========================
# OPENAPI
# =========================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=OPENAPI_3_0

springdoc.packages-to-scan=com.example.quanlydaotao.n8.controller
springdoc.paths-to-match=/api/n8/**
springdoc.auto-tag-classes=false

# =========================
# SWAGGER UI
# =========================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Mo cac nhom, thu gon tung API
springdoc.swagger-ui.doc-expansion=list

# Hien cau truc du lieu va cac truong
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.default-model-rendering=model

springdoc.swagger-ui.filter=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=false
springdoc.swagger-ui.persist-authorization=false