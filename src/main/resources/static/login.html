
<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg?v=4">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Quản lý đào tạo Nhóm 8</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #08182c,
                #152d49,
                #0d192b
            );
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Khung đăng nhập */
        .login-container {
            width: 1150px;
            max-width: 100%;
            min-height: 680px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #292b30;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Hình ảnh trường học */
        .login-image {
            background-image: url('/images/truong.jpg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
        }

        .login-image::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.18),
                transparent 50%
            );
        }

        /* Form bên phải */
        .login-right {
            padding: 48px 42px;
            color: #f3f4f6;
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 42px;
        }

        .login-logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1478c9;
            border-radius: 13px;
        }

        .login-logo svg {
            width: 34px;
            height: 34px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-brand strong {
            display: block;
            font-size: 20px;
            color: white;
            letter-spacing: 0.3px;
        }

        .login-brand span {
            display: block;
            margin-top: 7px;
            color: #b9bec8;
            font-size: 19px;
        }

        h1 {
            margin: 0 0 35px;
            font-size: 34px;
            font-weight: 700;
            color: #ffffff;
        }

        label {
            display: block;
            margin: 22px 0 11px;
            font-size: 17px;
            font-weight: 600;
            color: #f1f3f6;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            height: 58px;
            padding: 15px 48px;
            border: 1px solid #555d6a;
            border-radius: 11px;
            background: #262a32;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .input-group input:focus {
            border-color: #2e9af0;
            box-shadow: 0 0 0 3px rgba(46, 154, 240, 0.13);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aeb7c4;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .input-icon svg {
            width: 21px;
            height: 21px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            margin: 0;
            padding: 8px;
            border: none;
            background: transparent;
            color: #b8c0cc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: white;
            background: transparent;
        }

        .toggle-password svg {
            width: 22px;
            height: 22px;
        }

        /* Nút đăng nhập */
        .login-button {
            width: 100%;
            height: 58px;
            margin-top: 35px;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(
                135deg,
                #0879db,
                #0865c9
            );
            color: white;
            font-size: 19px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #095eb3;
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* Thông báo lỗi */
        #message {
            color: #ff8181;
            text-align: center;
            font-size: 14px;
            margin-top: 18px;
            min-height: 18px;
        }

        /* Đăng ký */
        .register-link {
            margin-top: 25px;
            text-align: center;
            color: #d1d5db;
            font-size: 16px;
        }

        .register-link a {
            color: #40a8ff;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            color: #8dccff;
            text-decoration: underline;
        }

        /* Giao diện điện thoại */
        @media (max-width: 800px) {
            body {
                padding: 12px;
            }

            .login-container {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .login-image {
                min-height: 230px;
            }

            .login-right {
                padding: 32px 25px;
            }

            .login-brand {
                margin-bottom: 28px;
            }

            .login-brand strong {
                font-size: 17px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Ảnh trường học bên trái -->
        <div class="login-image"></div>

        <!-- Form đăng nhập bên phải -->
        <div class="login-right">

            <div class="login-brand">

                <div class="login-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M2 10L12 5L22 10L12 15Z"/>
                        <path d="M6 12V17C9 20 15 20 18 17V12"/>
                        <path d="M22 10V16"/>
                    </svg>
                </div>

                <div>
                    <strong>QL ĐÀO TẠO TÍN CHỈ</strong>
                    <span>Nhóm 8</span>
                </div>

            </div>

            <h1>Đăng nhập</h1>

            <form id="loginForm">

                <!-- Email -->
                <label for="email">Email</label>

                <div class="input-group">

                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <rect x="3" y="5"
                                  width="18" height="14"
                                  rx="2"/>
                            <path d="M3 7L12 13L21 7"/>
                        </svg>
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập email của bạn"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- Mật khẩu -->
                <label for="password">Mật khẩu</label>

                <div class="input-group">

                    <span class="input-icon">
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <rect x="5" y="10"
                                  width="14" height="11"
                                  rx="2"/>
                            <path d="M8 10V7A4 4 0 0 1 16 7V10"/>
                        </svg>
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Hiện mật khẩu"
                        aria-pressed="false"
                        title="Hiện hoặc ẩn mật khẩu"
                    >
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">
                            <path d="M2 12S6 5 12 5S22 12 22 12S18 19 12 19S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>

                </div>

                <div id="message" role="alert" aria-live="polite"></div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Đăng nhập
                </button>

            </form>

            <div class="register-link">
                Chưa có tài khoản?
                <a href="/register.html">Đăng ký</a>
            </div>

        </div>

    </div>

    <script>
        // Hiện / ẩn mật khẩu
        const togglePassword =
            document.getElementById("togglePassword");

        const passwordInput =
            document.getElementById("password");

        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";

            togglePassword.setAttribute(
                "aria-pressed",
                String(isHidden)
            );

            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Ẩn mật khẩu" : "Hiện mật khẩu"
            );
        });

        // Xử lý đăng nhập - giữ nguyên API Nhóm 8
        document.getElementById("loginForm")
            .addEventListener("submit", async function (e) {

                e.preventDefault();

                const message =
                    document.getElementById("message");

                const loginButton =
                    document.getElementById("loginButton");

                message.textContent = "";
                loginButton.disabled = true;
                loginButton.textContent = "Đang đăng nhập...";

                try {
                    const response = await fetch("/api/auth/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "same-origin",
                        body: JSON.stringify({
                            email: document.getElementById("email").value,
                            password: document.getElementById("password").value
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.message || "Đăng nhập thất bại"
                        );
                    }

                    // Đăng nhập thành công
                    window.location.href = "/";

                } catch (error) {
                    message.textContent = error.message;
                } finally {
                    loginButton.disabled = false;
                    loginButton.textContent = "Đăng nhập";
                }
            });
    </script>

</body>
</html>
